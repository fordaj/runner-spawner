name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formatting:
    name: Check Formatting (Windows)
    # NOTE: macOS legs removed — both [self-hosted, macOS] runners
    # (maestro-ci-macos, maestro-ci-windows) are OFFLINE, so macOS jobs
    # queue forever. See https://github.com/fordaj/runner-spawner/issues/9.
    # Restore a macOS leg ([self-hosted, macOS]) once those runners are back.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # cache: false — setup-go's Post Run cache step hangs indefinitely
      # on these self-hosted Windows runners.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # goimports via `go install` (lands in $(go env GOPATH)/bin).
      # Pinned to v0.30.0: newer x/tools releases require go >= 1.26,
      # newer than the go on PATH here (1.23.x, GOTOOLCHAIN=local).
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      # uv for the Python side (formattington via uv run). uv also
      # fetches CPython 3.14 on first use.
      - uses: astral-sh/setup-uv@v7

      # node + npm for the PATH-only formatter CLIs (prettier).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # prettier (npm) — matches the PATH-only requirement in format.bash.
      - name: Install prettier
        run: npm install --global prettier

      # shfmt — pinned release, installed into a scratch bin dir.
      - name: Install shfmt
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/fmt-bin"
          mkdir -p "$bin_dir"
          case "$(uname -s)-$(uname -m)" in
            Darwin-x86_64)                 s=shfmt_v3.14.1_darwin_amd64 ;;
            Darwin-arm64)                  s=shfmt_v3.14.1_darwin_arm64 ;;
            Linux-x86_64)                  s=shfmt_v3.14.1_linux_amd64 ;;
            Linux-aarch64|Linux-arm64)     s=shfmt_v3.14.1_linux_arm64 ;;
            MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) s=shfmt_v3.14.1_windows_amd64.exe ;;
            MINGW*-aarch64|MSYS*-aarch64|CYGWIN*-aarch64|*arm64)   s=shfmt_v3.14.1_windows_amd64.exe ;;
            *) echo "unsupported platform: $(uname -s) $(uname -m)" >&2; exit 2 ;;
          esac
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.14.1/$s" -o "$bin_dir/shfmt"
          chmod +x "$bin_dir/shfmt"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          uv --version
          prettier --version
          shfmt --version
          goimports -h 2>&1 | head -1 || true

      # Requires uv, bash, prettier, shfmt, and goimports (all installed
      # above). Exits non-zero when anything is unformatted.
      - name: Run formattington format check
        run: ./ci/format_check.bash

  test:
    name: Test (Windows)
    # NOTE: macOS leg removed — [self-hosted, macOS] runners are OFFLINE,
    # so macOS jobs queue forever. See
    # https://github.com/fordaj/runner-spawner/issues/9.
    # Restore a macOS leg ([self-hosted, macOS]) once those runners are back.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # cache: false — setup-go's Post Run cache step hangs indefinitely
      # on these self-hosted Windows runners.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go build ./...
